name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metagenomics-research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r research/metagenomics/followup/requirements.txt
      - run: python -m unittest discover -s research/metagenomics/tests -v
      - run: python -m unittest discover -s research/metagenomics/followup/tests -v
      - run: python -m compileall -q research/metagenomics
      - run: bash -c 'for script in research/metagenomics/template/scripts/*.sh; do bash -n "$script" || exit; done'
      - run: bash -c 'for script in research/metagenomics/followup/template/scripts/*.sh; do bash -n "$script" || exit; done'

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm app:build-main

      - run: pnpm test
